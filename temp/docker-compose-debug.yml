services:
  backend:
    image: ahatutor-v20-backend
    env_file:
      - .env
    environment:
      PORT: 8000
      DATABASE_PATH: /app/data/aha_tutor.db
      PLUGINS_DIR: /app/plugins
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    # 临时注释健康检查，方便调试
    # healthcheck:
    #   test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
    #   interval: 30s
    #   timeout: 5s
    #   retries: 3
    #   start_period: 20s

  frontend:
    image: ahatutor-v20-frontend
    depends_on:
      - backend  # 改为简单依赖，不等待健康检查
    ports:
      - "${WEB_PORT:-80}:80"
    restart: unless-stopped
